server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: orchestrator-app

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  prometheus:
    metrics:
      export:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true

consumer:
  base-url: ${SPRING_CONSUMER_BASE_URL:http://localhost:8080}

ollama:
  base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
  generation-model: ${OLLAMA_GENERATION_MODEL:qwen2.5:7b-instruct}
  fallback-model: ${OLLAMA_FALLBACK_MODEL:qwen2.5:3b}
  connect-timeout: ${OLLAMA_CONNECT_TIMEOUT:4s}
  read-timeout: ${OLLAMA_READ_TIMEOUT:45s}

