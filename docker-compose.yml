services:
  orchestrator-app:
    build:
      context: .
      dockerfile: orchestrator-app/Dockerfile
    container_name: domain-orchestrator-app
    environment:
      SERVER_PORT: 8081
      SPRING_CONSUMER_BASE_URL: ${SPRING_CONSUMER_BASE_URL:-http://host.docker.internal:8080}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_GENERATION_MODEL: ${OLLAMA_GENERATION_MODEL:-qwen2.5:7b-instruct}
      OLLAMA_FALLBACK_MODEL: ${OLLAMA_FALLBACK_MODEL:-qwen2.5:3b}
      OLLAMA_CONNECT_TIMEOUT: ${OLLAMA_CONNECT_TIMEOUT:-4s}
      OLLAMA_READ_TIMEOUT: ${OLLAMA_READ_TIMEOUT:-45s}
    ports:
      - "8081:8081"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/actuator/health/readiness > /dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  prometheus:
    image: prom/prometheus:latest
    container_name: domain-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./docker/prometheus-rules.yml:/etc/prometheus/rules/domain-rules.yml:ro

  grafana:
    image: grafana/grafana:latest
    container_name: domain-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: domain-frontend
    ports:
      - "5173:80"
    depends_on:
      orchestrator-app:
        condition: service_healthy

volumes:
  grafana_data:

